name: frontend-rest-typescript-react

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run contract consumption tests
        env:
          SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
        run: npm test
      - name: Upload Specmatic reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: specmatic-reports-frontend-rest-typescript-react
          path: build/reports/specmatic
      - name: Build Docker image
        run: docker build -t frontend-rest-typescript-react .
