name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run contract tests
        env:
          SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
        run: ./mvnw test
      - name: Upload Specmatic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specmatic-report
          path: |
            build/reports/specmatic/**
            target/specmatic/**
            .specmatic/reports/**
          if-no-files-found: ignore
      - name: Build Docker image
        run: docker build -t specmatic-sample/bff-rest-java-spring-in-memory .
