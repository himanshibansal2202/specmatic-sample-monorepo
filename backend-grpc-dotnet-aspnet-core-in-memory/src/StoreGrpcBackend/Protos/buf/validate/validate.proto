syntax = "proto3";

package buf.validate;

import "google/protobuf/descriptor.proto";

message FieldConstraints {
  bool required = 1;
  EnumRules enum = 2;
  Int32Rules int32 = 3;
  StringRules string = 4;
}

message EnumRules {
  bool defined_only = 1;
}

message Int32Rules {
  int32 gte = 1;
  int32 lte = 2;
}

message StringRules {
  uint64 min_len = 1;
  uint64 max_len = 2;
}

extend google.protobuf.FieldOptions {
  FieldConstraints field = 1159;
}
