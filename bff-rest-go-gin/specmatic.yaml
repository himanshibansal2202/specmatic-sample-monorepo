version: 3

systemUnderTest:
  service:
    $ref: "#/components/services/orderBff"
    runOptions:
      $ref: "#/components/runOptions/orderBffTest"

dependencies:
  services:
    - service:
        $ref: "#/components/services/orderApi"
        runOptions:
          $ref: "#/components/runOptions/orderApiMock"
    - service:
        $ref: "#/components/services/productAudits"
        runOptions:
          $ref: "#/components/runOptions/productAuditsMock"

specmatic:
  governance:
    report:
      formats:
        - html
        - ctrf
      outputDirectory: build/reports/specmatic
    successCriteria:
      minCoveragePercentage: 92
      maxMissedOperationsInSpec: 1
      enforce: true
  settings:
    test:
      schemaResiliencyTests: all

components:
  sources:
    specmaticOrderContracts:
      git:
        url: https://github.com/specmatic/specmatic-order-contracts.git
  services:
    orderBff:
      description: Order BFF
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/specmaticOrderContracts"
            specs:
              - io/specmatic/examples/store/openapi/product_search_bff_v6.yaml
    orderApi:
      description: Order API dependency
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/specmaticOrderContracts"
            specs:
              - io/specmatic/examples/store/openapi/api_order_v5.yaml
    productAudits:
      description: Product audits Kafka dependency
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/specmaticOrderContracts"
            specs:
              - io/specmatic/examples/store/asyncapi/kafka.yaml
  runOptions:
    orderBffTest:
      openapi:
        type: test
        baseUrl: "{SUT_BASE_URL:http://localhost:8080}"
        filter: "PATH!='/health'"
    orderApiMock:
      openapi:
        type: mock
        baseUrl: "{STUB_BASE_URL:http://localhost:8090}"
    productAuditsMock:
      asyncapi:
        type: mock
        inMemoryBroker:
          host: "{KAFKA_HOST:localhost}"
          port: "{KAFKA_PORT:9092}"
          logDir: build/kafka-logs
        servers:
          - host: "{KAFKA_BROKER_URL:localhost:9092}"
            protocol: kafka
