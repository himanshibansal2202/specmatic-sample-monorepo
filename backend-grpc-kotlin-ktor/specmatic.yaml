version: 3
systemUnderTest:
  service:
    $ref: "#/components/services/orderApi"
    runOptions:
      $ref: "#/components/runOptions/orderApiGrpc"
components:
  sources:
    orderContracts:
      git:
        url: https://github.com/specmatic/specmatic-order-contracts.git
  services:
    orderApi:
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/orderContracts"
            specs:
              - io/specmatic/examples/store/grpc/order_api/product.proto
              - io/specmatic/examples/store/grpc/order_api/order.proto
  runOptions:
    orderApiGrpc:
      protobuf:
        type: test
        host: "{SPECMATIC_SUT_HOST:localhost}"
        port: "{SUT_PORT:8080}"
        importPaths:
          - .specmatic_grpc_working_dir
          - io/specmatic/examples/store/grpc
        protocVersion: 3.23.4
        requestTimeout: "{SPECMATIC_REQUEST_TIMEOUT_MS:10000}"
specmatic:
  settings:
    test:
      schemaResiliencyTests: all
