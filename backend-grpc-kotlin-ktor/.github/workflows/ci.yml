name: backend-grpc-kotlin-ktor

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run contract tests
        env:
          SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
        shell: bash
        run: ./mvnw test
      - name: Upload Specmatic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specmatic-report-${{ matrix.os }}
          path: build/reports/specmatic

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t backend-grpc-kotlin-ktor:latest .
