name: backend-grpc-kotlin-ktor

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run contract tests
        env:
          SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
        run: ./scripts/test.sh
      - name: Upload Specmatic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specmatic-reports
          path: build/specmatic-reports
      - name: Build Docker image
        if: github.ref == 'refs/heads/main'
        run: docker build -t backend-grpc-kotlin-ktor:latest .
