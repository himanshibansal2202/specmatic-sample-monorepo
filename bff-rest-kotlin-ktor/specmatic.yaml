version: 3
systemUnderTest:
  service:
    $ref: "#/components/services/orderBff"
    runOptions:
      $ref: "#/components/runOptions/orderBffOpenApi"
dependencies:
  services:
    - service:
        $ref: "#/components/services/orderApi"
        runOptions:
          $ref: "#/components/runOptions/orderApiOpenApiMock"
    - service:
        $ref: "#/components/services/productAuditKafka"
        runOptions:
          $ref: "#/components/runOptions/productAuditKafkaMock"
components:
  sources:
    orderContracts:
      git:
        url: https://github.com/specmatic/specmatic-order-contracts.git
  services:
    orderBff:
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/orderContracts"
            specs:
              - io/specmatic/examples/store/openapi/product_search_bff_v6.yaml
    orderApi:
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/orderContracts"
            specs:
              - io/specmatic/examples/store/openapi/api_order_v5.yaml
    productAuditKafka:
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/orderContracts"
            specs:
              - io/specmatic/examples/store/asyncapi/kafka.yaml
  runOptions:
    orderBffOpenApi:
      openapi:
        type: test
        baseUrl: "{SUT_BASE_URL:http://localhost:8080}"
        swaggerUrl: "{SUT_OPENAPI_URL:http://localhost:8080/openapi.yaml}"
    orderApiOpenApiMock:
      openapi:
        type: mock
        baseUrl: "{STUB_BASE_URL:http://localhost:8090}"
    productAuditKafkaMock:
      asyncapi:
        type: mock
        inMemoryBroker:
          host: "{BROKER_HOST:localhost}"
          port: "{BROKER_PORT:9092}"
        servers:
          - host: "{BROKER_URL:localhost:9092}"
            protocol: kafka
specmatic:
  governance:
    successCriteria:
      minCoveragePercentage: 70
      maxMissedOperationsInSpec: 1
      enforce: true
  settings:
    test:
      schemaResiliencyTests: all
