version: 3
dependencies:
  services:
    - service:
        $ref: "#/components/services/productsBffService"
        runOptions:
          $ref: "#/components/runOptions/productsBffMock"
        data:
          examples:
            - directories:
                - io/specmatic/examples/store/graphql/products_bff_examples

components:
  sources:
    orderContracts:
      git:
        url: https://github.com/specmatic/specmatic-order-contracts.git
  services:
    productsBffService:
      description: Products BFF GraphQL Service consumed by the React frontend
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/orderContracts"
            specs:
              - io/specmatic/examples/store/graphql/products_bff.graphqls
  runOptions:
    productsBffMock:
      graphqlsdl:
        type: mock
        specs:
          - spec:
              id: productsBffSpec
              host: 0.0.0.0
              port: 9000

specmatic:
  settings:
    test:
      schemaResiliencyTests: none
