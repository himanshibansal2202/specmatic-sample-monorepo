name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        env:
          SPECMATIC_IMAGE: specmatic/enterprise:latest
          SPECMATIC_LICENSE_PATH: ${{ secrets.SPECMATIC_LICENSE_PATH }}
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-graphql-typescript-react-graphql-service-reports
          path: |
            .specmatic/**
            build/reports/specmatic/**

  docker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t frontend-graphql-typescript-react-graphql-service:latest .
