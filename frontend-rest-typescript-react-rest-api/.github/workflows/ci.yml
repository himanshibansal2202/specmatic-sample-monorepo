name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specmatic-reports
          path: .specmatic/

  docker:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t frontend-rest-typescript-react-rest-api .
