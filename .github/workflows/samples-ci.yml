name: Samples CI

on:
  push:
  pull_request:

jobs:
  backend-rest-java-spring-boot-in-memory:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-rest-java-spring-boot-in-memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile
        run: ./mvnw compile
      - name: Test
        run: ./mvnw test
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-rest-java-spring-boot-in-memory-reports
          path: |
            backend-rest-java-spring-boot-in-memory/build/reports/specmatic/**
            backend-rest-java-spring-boot-in-memory/target/surefire-reports/**
            backend-rest-java-spring-boot-in-memory/.specmatic/**

  bff-rest-typescript-express-rest-api:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bff-rest-typescript-express-rest-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bff-rest-typescript-express-rest-api/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bff-rest-typescript-express-rest-api-reports-${{ matrix.os }}
          path: |
            bff-rest-typescript-express-rest-api/build/reports/specmatic/**
            bff-rest-typescript-express-rest-api/.specmatic/**

  frontend-rest-typescript-react-rest-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-rest-typescript-react-rest-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-rest-typescript-react-rest-api/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-rest-typescript-react-rest-api-reports
          path: |
            frontend-rest-typescript-react-rest-api/.specmatic/**

  frontend-graphql-typescript-react-graphql-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-graphql-typescript-react-graphql-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend-graphql-typescript-react-graphql-service/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        env:
          SPECMATIC_IMAGE: specmatic/enterprise:latest
          SPECMATIC_LICENSE_PATH: ${{ secrets.SPECMATIC_LICENSE_PATH }}
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-graphql-typescript-react-graphql-service-reports
          path: |
            frontend-graphql-typescript-react-graphql-service/build/reports/specmatic/**
            frontend-graphql-typescript-react-graphql-service/.specmatic/**

  backend-grpc-dotnet-aspnet-core-in-memory:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend-grpc-dotnet-aspnet-core-in-memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore backend-grpc-dotnet-aspnet-core-in-memory.sln
      - name: Build
        run: dotnet build backend-grpc-dotnet-aspnet-core-in-memory.sln --no-restore
      - name: Contract tests
        env:
          SPECMATIC_IMAGE: specmatic/enterprise:latest
          PROTOC_VERSION: "3.23.4"
        run: dotnet test backend-grpc-dotnet-aspnet-core-in-memory.sln --no-build
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-grpc-dotnet-aspnet-core-in-memory-reports-${{ matrix.os }}
          path: |
            backend-grpc-dotnet-aspnet-core-in-memory/build/reports/specmatic/**
            backend-grpc-dotnet-aspnet-core-in-memory/.specmatic/**

  backend-rest-javascript-express-in-memory:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend-rest-javascript-express-in-memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend-rest-javascript-express-in-memory/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-rest-javascript-express-in-memory-reports-${{ matrix.os }}
          path: |
            backend-rest-javascript-express-in-memory/build/reports/specmatic/**
            backend-rest-javascript-express-in-memory/.specmatic/**
