name: Specmatic Samples CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend-rest-java-spring-boot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend-rest-java-spring-boot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run contract tests
        env:
          SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
        run: ./mvnw test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-rest-java-spring-boot-specmatic-reports-${{ matrix.os }}
          path: backend-rest-java-spring-boot/build/reports/specmatic

  bff-rest-java-spring-boot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bff-rest-java-spring-boot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run contract tests
        env:
          SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
        run: ./mvnw test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bff-rest-java-spring-boot-specmatic-reports-${{ matrix.os }}
          path: bff-rest-java-spring-boot/build/reports/specmatic

  bff-graphql-java-spring-boot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bff-graphql-java-spring-boot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run contract tests
        env:
          SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
        run: ./mvnw test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bff-graphql-java-spring-boot-specmatic-reports-${{ matrix.os }}
          path: bff-graphql-java-spring-boot/build/reports/specmatic
          if-no-files-found: ignore
      - name: Build Docker image
        if: matrix.os == 'ubuntu-latest'
        run: docker build -t bff-graphql-java-spring-boot .

  bff-rest-kotlin-ktor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff-rest-kotlin-ktor
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Run contract tests
        env:
          SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
        run: ./scripts/test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bff-rest-kotlin-ktor-specmatic-reports
          path: bff-rest-kotlin-ktor/build/reports/specmatic
          if-no-files-found: ignore
      - name: Build Docker image
        run: docker build -t bff-rest-kotlin-ktor .

  backend-rest-typescript-express:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-rest-typescript-express
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend-rest-typescript-express/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run contract tests
        env:
          SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-rest-typescript-express-specmatic-reports
          path: backend-rest-typescript-express/build/reports/specmatic
          if-no-files-found: ignore
      - name: Build Docker image
        run: docker build -t backend-rest-typescript-express .

  frontend-rest-typescript-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-rest-typescript-react
    env:
      SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-rest-typescript-react/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run contract tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-rest-typescript-react-specmatic-reports
          path: frontend-rest-typescript-react/build/reports/specmatic
          if-no-files-found: ignore
      - name: Build Docker image
        run: docker build -t frontend-rest-typescript-react .

  bff-rest-typescript-express:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff-rest-typescript-express
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bff-rest-typescript-express/package-lock.json
      - uses: docker/setup-buildx-action@v3
      - name: Install dependencies
        run: npm ci
      - name: Run contract tests
        env:
          SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bff-rest-typescript-express-specmatic-reports
          path: bff-rest-typescript-express/build/reports/specmatic
          if-no-files-found: ignore
      - name: Build Docker image
        run: docker build -t bff-rest-typescript-express .
