name: Samples CI

on:
  push:
  pull_request:

jobs:
  backend-rest-python-fastapi:
    name: backend-rest-python-fastapi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-rest-python-fastapi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run contract tests
        env:
          SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
        run: pytest test -v -s
      - name: Upload Specmatic reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: specmatic-reports-backend-rest-python-fastapi
          path: backend-rest-python-fastapi/build/reports/specmatic

  bff-rest-java-spring-boot:
    name: bff-rest-java-spring-boot
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run contract tests
        working-directory: bff-rest-java-spring-boot
        env:
          SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
        run: ./mvnw test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bff-rest-java-spring-boot-specmatic-report-${{ matrix.os }}
          path: bff-rest-java-spring-boot/build/reports/specmatic

  backend-grpc-kotlin-ktor:
    name: backend-grpc-kotlin-ktor
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run contract tests
        working-directory: backend-grpc-kotlin-ktor
        env:
          SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
        shell: bash
        run: ./mvnw test
      - name: Upload Specmatic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-grpc-kotlin-ktor-specmatic-report-${{ matrix.os }}
          path: backend-grpc-kotlin-ktor/build/reports/specmatic

  bff-rest-kotlin-ktor:
    name: bff-rest-kotlin-ktor
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run contract tests
        working-directory: bff-rest-kotlin-ktor
        env:
          SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
        shell: bash
        run: ./mvnw test
      - name: Upload Specmatic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bff-rest-kotlin-ktor-specmatic-report-${{ matrix.os }}
          path: bff-rest-kotlin-ktor/build/reports/specmatic

  backend-rest-java-spring-boot:
    name: backend-rest-java-spring-boot
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run contract tests
        working-directory: backend-rest-java-spring-boot
        env:
          SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
        shell: bash
        run: ./mvnw test
      - name: Upload Specmatic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-rest-java-spring-boot-specmatic-report-${{ matrix.os }}
          path: backend-rest-java-spring-boot/build/reports/specmatic
