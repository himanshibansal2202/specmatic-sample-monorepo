version: 3

systemUnderTest:
  service:
    $ref: "#/components/services/order_bff"
    runOptions:
      $ref: "#/components/runOptions/order_bff_test"

dependencies:
  services:
    - service:
        $ref: "#/components/services/order_api"
        runOptions:
          $ref: "#/components/runOptions/order_api_mock"
    - service:
        $ref: "#/components/services/product_audits"
        runOptions:
          $ref: "#/components/runOptions/product_audits_mock"

components:
  sources:
    order_contracts:
      git:
        url: https://github.com/specmatic/specmatic-order-contracts.git
  services:
    order_bff:
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/order_contracts"
            specs:
              - io/specmatic/examples/store/openapi/product_search_bff_v6.yaml
    order_api:
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/order_contracts"
            specs:
              - io/specmatic/examples/store/openapi/api_order_v5.yaml
    product_audits:
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/order_contracts"
            specs:
              - io/specmatic/examples/store/asyncapi/kafka.yaml
  runOptions:
    order_bff_test:
      openapi:
        type: test
        baseUrl: "{SUT_BASE_URL:http://localhost:8080}"
    order_api_mock:
      openapi:
        type: mock
        host: "{STUB_HOST:localhost}"
        port: "{STUB_PORT:8090}"
    product_audits_mock:
      asyncapi:
        type: mock
        inMemoryBroker:
          host: "{BROKER_HOST:localhost}"
          port: "{BROKER_PORT:9092}"
        servers:
          - host: "{BROKER_URL:localhost:9092}"
            protocol: kafka

specmatic:
  governance:
    successCriteria:
      minCoveragePercentage: 70
      maxMissedOperationsInSpec: 1
      enforce: true
  settings:
    test:
      schemaResiliencyTests: all
