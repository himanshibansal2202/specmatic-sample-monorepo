name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specmatic-reports-${{ matrix.os }}
          path: |
            build/reports/specmatic/**
            .specmatic/**

  docker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t bff-rest-javascript-express-in-memory .
