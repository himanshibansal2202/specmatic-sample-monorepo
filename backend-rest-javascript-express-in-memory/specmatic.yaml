version: 3
specmatic:
  settings:
    test:
      schemaResiliencyTests: none
systemUnderTest:
  service:
    $ref: "#/components/services/orderApi"
    runOptions:
      $ref: "#/components/runOptions/orderApiTest"
components:
  sources:
    orderContracts:
      git:
        url: https://github.com/specmatic/specmatic-order-contracts.git
  services:
    orderApi:
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/orderContracts"
            specs:
              - io/specmatic/examples/store/openapi/api_order_v5.yaml
  runOptions:
    orderApiTest:
      openapi:
        type: test
        baseUrl: "{SUT_BASE_URL:http://localhost:8080}"
