name: bff-graphql-java-spring-boot

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  contract-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run contract tests
        env:
          SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
        run: ./mvnw test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bff-graphql-java-spring-boot-specmatic-reports-${{ matrix.os }}
          path: build/reports/specmatic
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t bff-graphql-java-spring-boot .
