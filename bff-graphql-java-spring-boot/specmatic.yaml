version: 3

systemUnderTest:
  service:
    $ref: "#/components/services/productsBffGraphql"
    runOptions:
      $ref: "#/components/runOptions/productsBffGraphqlTest"

dependencies:
  services:
    - service:
        $ref: "#/components/services/orderApi"
        runOptions:
          $ref: "#/components/runOptions/orderApiMock"

components:
  sources:
    specmaticOrderContracts:
      git:
        url: https://github.com/specmatic/specmatic-order-contracts.git

  services:
    productsBffGraphql:
      description: Products BFF GraphQL API
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/specmaticOrderContracts"
            specs:
              - io/specmatic/examples/store/graphql/products_bff.graphqls
    orderApi:
      description: Order API REST dependency
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/specmaticOrderContracts"
            specs:
              - io/specmatic/examples/store/openapi/api_order_v5.yaml

  runOptions:
    productsBffGraphqlTest:
      graphqlsdl:
        type: test
        host: "{SUT_HOST:127.0.0.1}"
        port: "{SUT_PORT:8080}"
    orderApiMock:
      openapi:
        type: mock
        baseUrl: "{STUB_BASE_URL:http://127.0.0.1:8090}"

specmatic:
  governance:
    report:
      formats:
        - html
        - ctrf
      outputDirectory: build/reports/specmatic
  settings:
    test:
      schemaResiliencyTests: all
