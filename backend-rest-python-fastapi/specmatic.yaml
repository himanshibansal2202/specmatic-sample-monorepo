version: 3
systemUnderTest:
  service:
    $ref: "#/components/services/orderApi"
    runOptions:
      $ref: "#/components/runOptions/orderApi"
components:
  sources:
    specmaticOrderContracts:
      git:
        url: https://github.com/specmatic/specmatic-order-contracts.git
  services:
    orderApi:
      description: Order API backend implemented by this FastAPI sample
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/specmaticOrderContracts"
            specs:
              - io/specmatic/examples/store/openapi/api_order_v5.yaml
  runOptions:
    orderApi:
      openapi:
        type: test
        baseUrl: "{SUT_BASE_URL:http://localhost:8080}"
        actuatorUrl: "{SUT_ACTUATOR_URL:http://localhost:8080/openapi.json}"
specmatic:
  governance:
    report:
      formats:
        - html
      outputDirectory: build/reports/specmatic
    successCriteria:
      minCoveragePercentage: 65
      maxMissedOperationsInSpec: 1
      enforce: true
  settings:
    test:
      timeoutInMilliseconds: 10000
      schemaResiliencyTests: all
