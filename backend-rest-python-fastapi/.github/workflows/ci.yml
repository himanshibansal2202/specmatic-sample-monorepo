name: backend-rest-python-fastapi

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run contract tests
        env:
          SPECMATIC_LICENSE_KEY: ${{ secrets.SPECMATIC_LICENSE_KEY }}
        run: pytest test -v -s
      - name: Upload Specmatic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specmatic-reports-${{ matrix.os }}
          path: build/reports/specmatic
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t backend-rest-python-fastapi .
