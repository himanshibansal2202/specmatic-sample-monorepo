version: 3

systemUnderTest:
  service:
    $ref: "#/components/services/orderApi"
    runOptions:
      $ref: "#/components/runOptions/orderApiTest"

specmatic:
  governance:
    report:
      formats:
        - html
        - ctrf
      outputDirectory: build/reports/specmatic
    successCriteria:
      minCoveragePercentage: "{SPECMATIC_MIN_COVERAGE:68}"
      maxMissedOperationsInSpec: "{SPECMATIC_MAX_MISSED_OPERATIONS:0}"
      enforce: "{SPECMATIC_COVERAGE_ENFORCE:true}"
  settings:
    test:
      schemaResiliencyTests: "{SCHEMA_RESILIENCY_TESTS:all}"

components:
  sources:
    specmaticOrderContracts:
      git:
        url: https://github.com/specmatic/specmatic-order-contracts.git
  services:
    orderApi:
      description: Order API v5 backend
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/specmaticOrderContracts"
            specs:
              - io/specmatic/examples/store/openapi/api_order_v5.yaml
  runOptions:
    orderApiTest:
      openapi:
        type: test
        baseUrl: "{SUT_BASE_URL:http://localhost:8080}"
